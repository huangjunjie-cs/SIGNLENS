[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "signlens"
version = "2.0.0.dev0"
description = "Measure and characterize polarization in signed social networks."
readme = "README.rst"
license = { text = "MIT" }
authors = [{ name = "Junjie Huang" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.11",
  "pandas>=2.0",
  "networkx>=3.0",
  "texttable>=1.6",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "matplotlib>=3.7"]

[project.scripts]
signlens = "signlens.cli:main"

[project.urls]
Homepage = "https://github.com/huangjunjie-cs/SIGNLENS"

[tool.hatch.build.targets.wheel]
packages = ["signlens", "sign_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
exclude = ["spiders", "ipynbs", "docs", "sign_lens/utils.py"]

[tool.ruff.lint]
# int(round(np.float64)) is intentional; FastAPI uses File()/Form() defaults; best-effort fallbacks catch broadly
ignore = ["RUF046", "BLE001", "B008", "RUF059"]
